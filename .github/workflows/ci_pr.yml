name: "CI - Pull Requests"

on:
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        
      - name: Set up JDK 8
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 8
          
      - name: Restore local Maven repository from cache
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles( 'project.clj' ) }}
          restore-keys: |
            ${{ runner.os }}-maven-
            
      - name: Setup linter
        uses: DeLaGuardo/setup-clojure@13
        with:
          clj-kondo: '2026.10.26'
          
      - name: Lint
        run: clj-kondo --lint src test

  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 8
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 8

      - name: Restore local Maven repository from cache
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles( 'project.clj' ) }}
          restore-keys: |
            ${{ runner.os }}-maven-
            
      - name: Install Leiningen
        uses: DeLaGuardo/setup-clojure@13
        with:
          lein: latest

      - name: Unit tests
        env:
          IP_STACK_ACCESS_KEY: ${{ secrets.IP_STACK_ACCESS_KEY }}
        run: lein test

  deploy-snapshot:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Deploy snapshots for PRs so they can be tested elsewhere
    # One Clojars deploy at a time across all PRs and releases, so concurrent uploads cannot leave metadata and checksums out of sync
    concurrency:
      group: clojars-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        
      - name: Set up JDK 8
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 8
          
      - name: Restore local Maven repository from cache
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles( 'project.clj' ) }}
          restore-keys: |
            ${{ runner.os }}-maven-
            
      - name: Install Leiningen
        uses: DeLaGuardo/setup-clojure@13
        with:
          lein: latest

      - name: Deploy SNAPSHOT version
        env:
          SNAPSHOT_REGEX: ^[0-9]{1,2}[.][0-9]{1,2}[.][0-9]{1,3}-SNAPSHOT$
          CLOJARS_USERNAME: ${{ secrets.CLOJARS_USERNAME }}
          CLOJARS_PASSWORD: ${{ secrets.CLOJARS_PASSWORD }}
        run: |
          git config --global user.name "github-actions-bot"
          git config --global user.email "<>"
          lein pom
          export VERSION=$(grep "<version>" pom.xml | head -1 | cut -d ">" -f2 | cut -d "<" -f1)
          echo "version is:" $VERSION
          if [[ !("$VERSION" =~ $SNAPSHOT_REGEX) ]]
          then
            echo "Version isn't a SNAPSHOT version:" $VERSION ", skipping deployment to Clojars..."
            exit 0
          fi
          lein deploy
          echo "SNAPSHOT version:" $VERSION"; commit: "${{github.sha}}"; PR: "${{github.event.pull_request.number}}"; successfully deployed to Clojars"
